[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 80
target-version = ['py310']
extend-exclude = '''
/(
    \.git
  | \.github
  | \.idea
  | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 80
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
atomic = true

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_return_any = false
pretty = true
follow_imports = 'silent'
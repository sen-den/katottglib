name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Check formatting
        run: |
          isort --check-only .
          black --check .

      - name: Run tests
        run: python -m unittest discover -s tests -t .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: The codifier must ship, the cache must not
        run: |
          python - <<'EOF'
          import glob
          import zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "katottglib/kodifikator.xlsx" in names, names
          assert not [n for n in names if n.endswith(".pkl")], names
          assert not [n for n in names if n.startswith("tests/")], names
          print("wheel contents ok")
          EOF
